<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貯金進捗トラッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>貯金の進捗</h1>

    <div class="field">
      <label for="goal-amount">目標額（円）</label>
      <input type="number" id="goal-amount" min="0" step="1" placeholder="例: 100000">
    </div>

    <div class="field">
      <label for="current-amount">現在の貯金額（円）</label>
      <input type="number" id="current-amount" min="0" step="1" placeholder="例: 70000">
      <p id="previous-diff" class="previous-diff"></p>
    </div>

    <div class="field">
      <label for="diff-amount">増減額を入力（円）</label>
      <input type="number" id="diff-amount" step="1" placeholder="例: 5000 や -3000">
      <p id="diff-preview" class="diff-preview"></p>
      <button type="button" id="diff-save-button" class="save-button" disabled>この内容で保存</button>
    </div>

    <div class="result">
      <div class="mug-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg class="mug-svg" viewBox="0 0 100 160" aria-hidden="true">
          <defs>
            <clipPath id="mug-body-clip">
              <path d="M19,15 H81 a4,4 0 0 1 4,4 L76,133 a12,12 0 0 1 -12,12 H36 a12,12 0 0 1 -12,-12 L15,19 a4,4 0 0 1 4,-4 Z" />
            </clipPath>
            <linearGradient id="beer-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f6c34c" />
              <stop offset="100%" stop-color="#c9821f" />
            </linearGradient>
          </defs>
          <g clip-path="url(#mug-body-clip)">
            <rect id="mug-fill" class="mug-fill" x="10" y="145" width="80" height="0"></rect>
            <rect id="mug-foam" class="mug-foam" x="10" y="145" width="80" height="0"></rect>
          </g>
          <path class="mug-outline" d="M19,15 H81 a4,4 0 0 1 4,4 L76,133 a12,12 0 0 1 -12,12 H36 a12,12 0 0 1 -12,-12 L15,19 a4,4 0 0 1 4,-4 Z" />
        </svg>
      </div>
      <div class="result-row">
        <span class="result-label">差額</span>
        <span id="difference" class="result-value">-</span>
      </div>
      <div class="result-row">
        <span class="result-label">達成率</span>
        <span id="achievement-rate" class="result-value">-</span>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
